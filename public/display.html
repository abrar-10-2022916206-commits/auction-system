<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Auction Display</title>
    <meta name="description"
        content="Live football auction display. Real-time transfer budgets, squads, and bidding updates.">
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Celebration Overlay Modal -->
    <div class="celebration-overlay" id="celebration-overlay">
        <div class="celebration-card">
            <div class="celebration-title">⚽ NEW BIDDING 📝</div>
            <div class="celebration-jersey-container">
                <span class="celebration-jersey">👕</span>
            </div>
            <div class="celebration-player-name" id="celebrate-player-name">Player Name</div>
            <div class="celebration-team-name" id="celebrate-team-name">Team Name</div>
            <div class="celebration-price" id="celebrate-price">💰 000</div>
        </div>
    </div>

    <!-- Page Header -->
    <header class="display-header" id="display-header">
        <div class="display-header-center">
            <h1 id="page-header-title">Live Auction Display</h1>
        </div>
        <div class="display-header-actions">
            <div class="stat-chip" title="Total players bid">
                ⚽ Bid: <span class="stat-val" id="total-sold">0</span>
            </div>
            <button id="player-profile-btn" class="btn btn-export" type="button"
                onclick="window.location.href='playerProfile.html'">👤 Player Profile</button>
            <button id="download-btn" class="btn btn-export" onclick="exportPDF()">📄 Export PDF</button>
        </div>
    </header>

    <!-- Developer Credit -->
    <div class="developer-credit-corner">© Developed by ABRAR1552</div>

    <!-- Activity Banner & Random Serial Display -->
    <div class="display-summary-row">
        <div class="sold-banner" id="msg-box">
            Waiting for transfer activity to begin…
        </div>

        <div class="random-number-container" id="random-number-container">
            <div class="random-number-label">🎲 Next Pick</div>
            <div class="random-number-value" id="random-number-value">—</div>
        </div>
    </div>

    <!-- Teams Roster Grid Container -->
    <div id="teams-container"></div>

    <!-- Bottom Statistics Bar -->
    <div class="stats-bar">
        <div class="stat-chip">Total Start Budget: <span class="stat-val" id="total-start-budget">—</span></div>
        <div class="stat-chip">Net Spent: <span class="stat-val" id="total-spent">—</span></div>
        <div class="stat-chip">Total Balance: <span class="stat-val" id="total-remaining">—</span></div>
    </div>

    <script>
        // Initialize Socket connection
        const socket = io({ auth: { token: sessionStorage.getItem('authToken') } });
        const container = document.getElementById("teams-container");

        // Active Configuration Defaults
        let BASE_PLAYER_PRICE = 20;
        let MIN_PLAYERS = 9;
        let BASE_TEAM_AMOUNT = 1000;
        let currentTeams = [];

        const errorSound = new Audio("beep.mp3");

        /**
         * Parses player string formatted as Name_BatchNo into display name and badge string
         */
        function parsePlayerName(name) {
            const parts = name.split('_');
            if (parts.length > 1) {
                return {
                    displayName: parts[0].trim(),
                    badge: parts.slice(1).join('_').trim()
                };
            }
            return { displayName: name, badge: null };
        }

        /**
         * Renders team roster boxes, budget cards, and progress bars dynamically
         */
        function renderTeams(teams) {
            currentTeams = teams;
            container.innerHTML = "";

            // Display welcome prompt if no teams are configured yet
            if (!teams || teams.length === 0) {
                container.style.gridTemplateColumns = "1fr";
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 24px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px dashed var(--border);">
                        <div style="font-size: 54px; margin-bottom: 16px;">🏆</div>
                        <h2 style="font-size: 24px; color: var(--neon-green); margin-bottom: 8px;">Welcome to Live Auction Display</h2>
                        <p style="color: var(--text-secondary); font-size: 15px;">Waiting for admin to configure tournament title, teams, and player list via Admin Control Panel…</p>
                    </div>
                `;
                document.getElementById('total-sold').textContent = "0";
                document.getElementById('total-start-budget').textContent = "—";
                document.getElementById('total-spent').textContent = "—";
                document.getElementById('total-remaining').textContent = "—";
                return;
            }

            container.style.gridTemplateColumns = `repeat(${Math.min(teams.length, 6)}, 1fr)`;

            let totalBalance = 0;

            teams.forEach((team, idx) => {
                const currentPlayers = team.players.length;
                const remaining = MIN_PLAYERS - currentPlayers;

                let maxBid = 0;
                if (remaining > 0) {
                    const minimumKeep = Math.max(0, remaining - 1) * BASE_PLAYER_PRICE;
                    maxBid = Math.max(0, team.balance - minimumKeep);
                }
                if (maxBid < BASE_PLAYER_PRICE) maxBid = 0;

                totalBalance += team.balance;

                const progress = Math.min((currentPlayers / MIN_PLAYERS) * 100, 100);

                const playersHTML = team.players.map((p, i) => {
                    const parsed = parsePlayerName(p.name);
                    const badgeHTML = parsed.badge ? `<span class="squad-player-badge">${parsed.badge}</span>` : "";
                    return `<tr>
                        <td style="text-align:left; padding-left:8px;">
                            <div class="squad-player-name">
                                ${i + 1}. ${parsed.displayName} ${badgeHTML}
                            </div>
                        </td>
                        <td>💰 ${p.bid}</td>
                    </tr>`;
                }).join("");

                const div = document.createElement("div");
                div.className = `team-box team-box-${idx % 6}`;
                div.id = `team-box-${idx}`;

                div.innerHTML = `
                    <h2>${team.name}</h2>
                    <div class="team-meta">
                        <div>
                            <span class="team-balance-label">Transfer Budget</span>
                            <span class="team-balance">${team.balance}</span>
                        </div>
                        <div class="team-max-bid">
                            <span class="team-max-bid-label">Max Bid</span>
                            <span class="team-max-bid-val">${maxBid > 0 ? maxBid : '—'}</span>
                        </div>
                    </div>
                    <div class="player-count-bar">
                        <span class="player-count-label">Squad: ${currentPlayers} / ${MIN_PLAYERS}</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr><th style="text-align:left; padding-left:8px;">Squad Member</th><th>Value</th></tr>
                        </thead>
                        <tbody>
                            ${playersHTML || '<tr><td colspan="2" style="color:var(--text-secondary);font-size:15px;text-align:center;padding:12px 0;">Empty Roster</td></tr>'}
                        </tbody>
                    </table>
                `;

                container.appendChild(div);
            });

            // Update stats bar
            const totalStartBudget = BASE_TEAM_AMOUNT * teams.length;
            const totalNetSpent = totalStartBudget - totalBalance;

            document.getElementById('total-sold').textContent = teams.reduce((a, t) => a + t.players.length, 0);
            document.getElementById('total-start-budget').textContent = totalStartBudget.toLocaleString();
            document.getElementById('total-spent').textContent = totalNetSpent >= 0 ? totalNetSpent.toLocaleString() : `+${Math.abs(totalNetSpent).toLocaleString()} gained`;
            document.getElementById('total-remaining').textContent = totalBalance.toLocaleString();
        }

        /**
         * Synthesizes a referee double-whistle sound effect using Web Audio API
         */
        function playWhistleSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gainNode = ctx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(2000, ctx.currentTime);
                osc1.frequency.linearRampToValueAtTime(2200, ctx.currentTime + 0.15);

                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(2020, ctx.currentTime);
                osc2.frequency.linearRampToValueAtTime(2220, ctx.currentTime + 0.15);

                const lfo = ctx.createOscillator();
                const lfoGain = ctx.createGain();
                lfo.frequency.value = 35;
                lfoGain.gain.value = 40;

                lfo.connect(lfoGain);
                lfoGain.connect(osc1.frequency);
                lfoGain.connect(osc2.frequency);

                gainNode.gain.setValueAtTime(0, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.04);
                gainNode.gain.setValueAtTime(0.25, ctx.currentTime + 0.18);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(ctx.destination);

                lfo.start();
                osc1.start();
                osc2.start();

                lfo.stop(ctx.currentTime + 0.4);
                osc1.stop(ctx.currentTime + 0.4);
                osc2.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Web Audio Whistle synthesis failed:", e);
            }
        }

        /**
         * Generates dynamic confetti particle animation
         */
        function launchConfetti() {
            const colors = ['#00ff88', '#f1c40f', '#ffffff', '#00f0ff', '#bd00ff', '#ff3333'];
            for (let i = 0; i < 75; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = (Math.random() * 7 + 6) + 'px';
                particle.style.height = (Math.random() * 7 + 6) + 'px';
                particle.style.animationDelay = (Math.random() * 0.4) + 's';
                particle.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                particle.style.transform = `rotate(${Math.random() * 360}deg)`;

                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 3000);
            }
        }

        /**
         * Triggers full-screen celebratory modal on successful bid or transfer
         */
        function triggerBiddingCelebration(playerName, teamName, amount, isTransfer = false) {
            const overlay = document.getElementById('celebration-overlay');
            const titleEl = overlay.querySelector('.celebration-title');
            const jerseyEl = overlay.querySelector('.celebration-jersey');
            const nameEl = document.getElementById('celebrate-player-name');
            const teamEl = document.getElementById('celebrate-team-name');
            const priceEl = document.getElementById('celebrate-price');
            const card = overlay.querySelector('.celebration-card');

            const parsed = parsePlayerName(playerName);
            nameEl.textContent = parsed.displayName;
            if (parsed.badge) {
                nameEl.innerHTML += ` <span class="player-badge">${parsed.badge}</span>`;
            }

            teamEl.textContent = teamName;

            if (isTransfer) {
                titleEl.textContent = '🔄 TRANSFER!';
                titleEl.style.color = '#f1c40f';
                jerseyEl.textContent = '💰';
                card.style.borderColor = '#f1c40f';
                card.style.boxShadow = '0 0 50px rgba(241,196,15,0.5), inset 0 0 20px rgba(241,196,15,0.1)';
                priceEl.textContent = `💸 ${amount}`;
                priceEl.style.background = 'linear-gradient(135deg, rgba(241,196,15,0.25), rgba(0,0,0,0.4))';
                priceEl.style.borderColor = 'rgba(241,196,15,0.4)';
            } else {
                titleEl.textContent = '⚽ NEW BIDDING 📝';
                titleEl.style.color = 'var(--neon-green)';
                jerseyEl.textContent = '👕';
                card.style.borderColor = 'var(--neon-green)';
                card.style.boxShadow = '0 0 50px rgba(0, 255, 136, 0.4), inset 0 0 20px rgba(0, 255, 136, 0.1)';
                priceEl.textContent = amount === "FREE" ? "FREE TRANSFER" : `💰 ${amount}`;
                priceEl.style.background = 'linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 0, 0, 0.4))';
                priceEl.style.borderColor = 'rgba(0, 255, 136, 0.3)';
            }

            overlay.classList.add('active');

            playWhistleSound();
            launchConfetti();

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 3800);
        }

        // Socket Listeners
        socket.on("config-update", data => {
            if (data.auctionTitle !== undefined) {
                const titleText = data.auctionTitle ? `${data.auctionTitle} — Auction Display` : "Live Auction Display";
                document.getElementById('page-header-title').textContent = titleText;
            }

            if (data.auctionConfig) {
                BASE_PLAYER_PRICE = data.auctionConfig.basePlayerPrice || 20;
                MIN_PLAYERS = data.auctionConfig.minPlayers || 9;
                BASE_TEAM_AMOUNT = data.auctionConfig.baseTeamAmount || 1000;
            }
            if (currentTeams.length > 0) {
                renderTeams(currentTeams);
            }
        });

        socket.on("update", data => {
            renderTeams(data.teams);
        });

        socket.on("number-update", data => {
            showRandomNumber(data.number, data.phase === 'skipped');
        });

        socket.on("message", data => {
            const box = document.getElementById("msg-box");
            box.textContent = data.text;
            box.className = `sold-banner ${data.type || ''}`;

            showToast(data.text, data.type);

            if (data.type === "error") {
                errorSound.play().catch(() => { });
            } else if (data.type === "success") {
                const text = data.text;
                const bidMatch = text.match(/⚽ (.*) (?:signed|bid) by (.*) for (\d+)! 📝/);
                const freeMatch = text.match(/⚽ (.*) drafted for FREE by (.*)! 📝/);
                const transferMatch = text.match(/🔄 (.*) transferred from .* to (.*) for (\d+)!/);

                if (bidMatch) {
                    triggerBiddingCelebration(bidMatch[1], bidMatch[2], bidMatch[3], false);
                } else if (freeMatch) {
                    triggerBiddingCelebration(freeMatch[1], freeMatch[2], "FREE", false);
                } else if (transferMatch) {
                    triggerBiddingCelebration(transferMatch[1], transferMatch[2], transferMatch[3], true);
                }

            }
        });

        /**
         * Generates and downloads PDF of current auction rosters
         */
        function exportPDF() {
            const header = document.getElementById('display-header');
            const downloadBtn = document.getElementById('download-btn');
            const toastContainer = document.getElementById('toast-container');

            header.style.display = 'none';
            downloadBtn.style.display = 'none';
            toastContainer.style.display = 'none';

            const options = {
                margin: 8,
                filename: `Auction_Display_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#05140b' },
                jsPDF: { unit: 'mm', format: 'a3', orientation: 'landscape' }
            };

            html2pdf().set(options).from(document.body).save()
                .then(() => showToast("PDF exported successfully!", "success"))
                .catch(() => showToast("PDF export failed. Please try again.", "error"))
                .finally(() => {
                    header.style.display = '';
                    downloadBtn.style.display = '';
                    toastContainer.style.display = '';
                });
        }

        function showToast(text, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type || ''}`;
            toast.textContent = text;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showRandomNumber(number, isUnsold) {
            const el = document.getElementById('random-number-value');
            el.classList.add('rolling');
            setTimeout(() => {
                if (number !== null && number !== undefined) {
                    el.textContent = isUnsold ? `⚪ ${number}` : number;
                    el.style.color = isUnsold ? '#f1c40f' : 'var(--neon-green)';
                } else {
                    el.textContent = 'All Done! ✅';
                    el.style.color = 'var(--neon-green)';
                }
                el.classList.remove('rolling');
            }, 150);
        }
    </script>

</body>

</html>
